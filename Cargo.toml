[package]
name = "peinit2"
version = "0.0.12"
description = "Peios PID 1, service control and the public libpeinit client library."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
# Use authd's shared PGSS codec for service-token requests.
auth-core = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios", "dep:auth-core"]
peios-registry = ["dep:peios"]
