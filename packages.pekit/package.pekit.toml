# Base metadata shared by every peinit package. The runtime package, libpeinit
# development files, debuginfo, and debugsource are all carved from one
# build.main tree, matching the peiosutils/libpeios split-package style.

format = "peipkg"

[package]
# -39: a TTYPath terminal is opened with READ_ATTRIBUTES as well, so the
# session it starts can fstat/ttyname its own terminal. PEI-716.
version      = "{{version}}-39"
architecture = "x86_64"
license      = "MIT"
