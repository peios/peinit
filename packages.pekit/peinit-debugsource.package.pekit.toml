# peinit-debugsource — Rust sources referenced by peinit's debug info, staged
# under /usr/src/debug/peinit. Pairs with peinit-debuginfo.

[package]
description = "Peios PID 1 service manager - debug sources"

[dependencies]
peinit-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug/"
