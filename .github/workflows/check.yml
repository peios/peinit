name: peinit build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: peinit-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libclang-dev pkg-config python3 python3-venv binutils groff nodejs npm autoconf libssl-dev zlib1g-dev tzdata
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
                  cargo +1.98.1 install cbindgen --version 0.29.2 --locked
                  sudo install "$HOME/.cargo/bin/cbindgen" /usr/local/bin/cbindgen
            - name: Select the shared JavaScript runtime
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.22.1"
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/peinit-style"
            - name: Check out the native SDK library
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/libpeios
                  ref: 3f2ce51c7cfc27644f72a053ca01888736905064
                  path: .ci-sdk/libpeios
                  persist-credentials: false
            - name: Check out the kernel ABI headers
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/kernel
                  ref: c966b93192535fe03663155e759424b62e9f0815
                  path: .ci-sdk/kernel
                  sparse-checkout: include/uapi/pkm
                  persist-credentials: false
            - name: Prepare the development SDK
              run: |
                  tools/prepare-dev-sdk .ci-sdk/libpeios .ci-sdk/kernel/include/uapi "$RUNNER_TEMP/peios-sdk"
            - name: Check style, build, tests and packages
              env:
                  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
                  PEIOS_SDK: ${{ runner.temp }}/peios-sdk
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/peinit-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/peinit-cargo-checks
              run: tools/check
            - name: Check out the documentation compiler
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-sdk/trail
                  persist-credentials: false
            - name: Build the pinned documentation compiler
              working-directory: .ci-sdk/trail
              run: tools/bazel build //:trail
            - name: Check documentation
              env:
                  TRAIL: ${{ github.workspace }}/.ci-sdk/trail/bazel-bin/trail
              run: tools/check-docs
