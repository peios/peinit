# peinit — Peios PID 1, its control client, and the public libpeinit ABI.
# One hermetic build produces independently installable runtime, client,
# library, development, debugging, and corresponding-source packages.

out_dir = "out"

[source_package]
name = "dev.peios.peinit-source"

[build.vendor]
command = '''
set -eu
CARGO_HOME=$(mktemp -d)
trap 'rm -rf "$CARGO_HOME"' EXIT
export CARGO_HOME
mkdir -p "$PEKIT_OUT"

cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust" = ">= 1.98.1"
"org.gnu.findutils"  = "*"
"org.mozilla.ca-certificates" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = ">= 0.8.5"
"org.gnu.grep" = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
TRIPLET=x86_64-linux-peios
LIBDIR="usr/lib/$TRIPLET"
DEBUG_PREFIX="/usr/src/debug/dev.peios.peinit-$PEKIT_VERSION"
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc g++ pkg-config cbindgen objcopy strip readelf debugedit python3; do
  command -v "$tool" >/dev/null || {
    echo "peinit: missing required build tool: $tool" >&2
    exit 1
  }
done

# Production consumes only the packaged C ABI. No sibling checkout or mutable
# Cargo cache is visible to the build.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
. packaging/check-libpeios.sh
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"peinit: workspace versions {versions!r} do not equal package version {expected!r}")
'

# Stable DWARF names keep the checkout, build root, and vendored-source cache
# out of every shipped ELF and detached symbol file.
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings --remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"
# Control-flow protection (PEI-1155). Peios' libstd is built with LLVM's CET
# instrumentation (org.rust-lang.rust); stable rustc applies it to other
# crates only under -Zcf-protection, so every crate here gets ENDBR landing
# pads and the IBT/SHSTK property survives the link. The bootstrap escape
# hatch is the one the Rust recipe itself uses for the same flag.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"
export CARGO_PROFILE_RELEASE_DEBUG=2
export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off

# The portable/default feature set is the host-runnable unit-test rung. The
# Peios boundary feature deliberately executes Peios-only syscalls in a few
# integration tests, so compile that complete test graph here but run it only
# on a booted Peios system.
for target in target-a target-b; do
  cargo build --release --locked --offline --all-features \
    --bin peinit2 --bin svctl --target-dir "$PEKIT_OUT/$target"
  cargo rustc --release --locked --offline --all-features --lib \
    --crate-type cdylib --target-dir "$PEKIT_OUT/$target" -- \
    -C link-arg=-Wl,-soname,libpeinit.so.0
done
cmp "$PEKIT_OUT/target-a/release/peinit2" "$PEKIT_OUT/target-b/release/peinit2"
cmp "$PEKIT_OUT/target-a/release/svctl" "$PEKIT_OUT/target-b/release/svctl"
cmp "$PEKIT_OUT/target-a/release/libpeinit.so" "$PEKIT_OUT/target-b/release/libpeinit.so"
TARGET=$PEKIT_OUT/target-a

# peinit2, svctl and libpeinit are all the peinit2 crate built with
# --all-features, so they link one crate closure. Their packages, the shared
# symbols and the debug sources ship its notices and declare the conjunction
# of its licences; --check holds each definition to it (PEI-1163). libauthd
# and peios-rs carry no package-local notice; ship the reviewed notices of
# those same pinned sources.
LICENSE_ROOT=$PEKIT_OUT/licenses
for definition in dev.peios.peinit dev.peios.peinit-svctl dev.peios.libpeinit \
  dev.peios.peinit-debuginfo dev.peios.peinit-debugsource
do
  /usr/libexec/peios-packaging/collect-rust-licences \
    --licence-root "$LICENSE_ROOT" --root peinit2 --all-features \
    --notice "git+https://github.com/peios/authd.git=third-party/authd-LICENSE" \
    --notice "git+https://github.com/peios/peios-rs.git=third-party/peios-rs-LICENSE" \
    --check "packages.pekit/$definition.package.pekit.toml"
done
test -s "$LICENSE_ROOT/crate-licenses.tsv"

mkdir -p "$PEKIT_OUT/usr/bin" "$PEKIT_OUT/usr/sbin" \
  "$PEKIT_OUT/$LIBDIR" "$PEKIT_OUT/usr/include/peinit" \
  "$PEKIT_OUT/$LIBDIR/pkgconfig" "$PEKIT_OUT/usr/share/man/man8"
cp "$TARGET/release/peinit2" "$PEKIT_OUT/usr/bin/peinit2"
cp "$TARGET/release/svctl" "$PEKIT_OUT/usr/bin/svctl"
for alias in reboot poweroff halt shutdown; do
  ln -s svctl "$PEKIT_OUT/usr/bin/$alias"
done
cp "$TARGET/release/libpeinit.so" "$PEKIT_OUT/$LIBDIR/libpeinit.so.0"
ln -s libpeinit.so.0 "$PEKIT_OUT/$LIBDIR/libpeinit.so"
cp include/peinit.h "$PEKIT_OUT/usr/include/"
cp include/peinit/*.h "$PEKIT_OUT/usr/include/peinit/"
sed -e 's|@prefix@|/usr|g' \
    -e "s|@libdir@|/$LIBDIR|g" \
    -e "s|@version@|$PEKIT_VERSION|g" \
    peinit.pc.in > "$PEKIT_OUT/$LIBDIR/pkgconfig/peinit.pc"
for page in peinit2 svctl; do
  gzip -n -9 -c "man/$page.8" > "$PEKIT_OUT/usr/share/man/man8/$page.8.gz"
done
for alias in reboot poweroff halt shutdown; do
  ln -s svctl.8.gz "$PEKIT_OUT/usr/share/man/man8/$alias.8.gz"
done

# One debug package is intentional for now: this source family previously
# shipped one combined peinit-debuginfo artifact, and preserving that migration
# capability without ambiguous multiple providers matters more than splitting
# three small symbol files. Runtime/client/library payloads remain independent.
# The split stays local rather than using
# /usr/libexec/peios-packaging/split-debug: symbols go to their own debuginfo
# tree, and the RUSTFLAGS remap already rewrote the vendor target's crates (a
# separate output tree) to the vendor/ prefix, which split-debug, copying only
# sources under one build root, would drop; the loop below resolves them back
# to $PEKIT_VENDOR_OUT.
: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list="$PEKIT_OUT/.debug-$component"
  debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  [ -n "$build_id" ] || {
    echo "peinit: $elf has no build ID" >&2
    exit 1
  }
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug="$PEKIT_OUT/debug/usr/lib/debug/.build-id/$first/$rest.debug"
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug peinit "$PEKIT_OUT/usr/bin/peinit2"
split_debug svctl "$PEKIT_OUT/usr/bin/svctl"
split_debug libpeinit "$PEKIT_OUT/$LIBDIR/libpeinit.so.0"

DEBUG_ROOT="$PEKIT_OUT$DEBUG_PREFIX"
mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue ;; esac
  case "$rel" in
    vendor/*) origin="$PEKIT_VENDOR_OUT/$rel" ;;
    *)        origin="$SRC/$rel" ;;
  esac
  [ -f "$origin" ] || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
  cp "$origin" "$DEBUG_ROOT/$rel"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

# PID 1 runs at the PeiosTcb tier. It supervises services that are PIP-
# protected (authd), and KACS refuses every signal, query and stop from a
# caller that does not dominate the target, so an unsigned peinit cannot
# verify a protected service's READY=1 or stop it (PEI-1153). The tier is
# selected by the signing key.
[build.main.sign.pip]
"usr/bin/peinit2" = "tcb.priv"

[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.bash"             = "*"
"dev.peios.peiosutils"     = ">= 0.8.5"
"org.gnu.diffutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.gawk"             = "*"
"org.gnu.grep"             = "*"
"org.gnu.gzip"             = "*"
"org.gnu.sed"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc"              = "*"
"org.gnu.gcc-c++"          = "*"
"org.llvm.clang"           = ">= 22"
"org.pkgconf.pkgconf"      = "*"
"org.mozilla.cbindgen"     = "0.29.2"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"
"dev.peios.kernel-headers" = ">= 0.20.1-rc13"
"org.iana.tzdata"          = ">= 2026c"
"dev.peios.packaging-tools" = ">= 1.0.1"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
TRIPLET=x86_64-linux-peios
LIBDIR="usr/lib/$TRIPLET"
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
command -v rustc >/dev/null
command -v cargo >/dev/null
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
. packaging/check-libpeios.sh
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings"
# The tests run with the same control-flow protection as build.main (PEI-1155).
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"
cargo test --release --locked --offline --target-dir "$PEKIT_OUT/target-test"
cargo test --release --locked --offline --all-features --no-run \
  --target-dir "$PEKIT_OUT/target-test"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
# Fail closed on hardening, symbol/source pairing, and build-path policy.
for record in \
  "peinit:$PEKIT_OUT/usr/bin/peinit2:exe" \
  "svctl:$PEKIT_OUT/usr/bin/svctl:exe" \
  "libpeinit:$PEKIT_OUT/$LIBDIR/libpeinit.so.0:dso"
do
  remain=${record#*:}
  elf=${remain%:*}
  kind=${record##*:}
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  if readelf -dW "$elf" | grep -E '(RPATH|RUNPATH)' >/dev/null; then
    echo "peinit: $elf carries an RPATH or RUNPATH" >&2
    exit 1
  fi
  if readelf -SW "$elf" | grep '\.debug_info' >/dev/null; then
    echo "peinit: $elf still contains unsplit debug information" >&2
    exit 1
  fi
  if [ "$kind" = exe ]; then
    readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  else
    readelf -dW "$elf" | grep -Fq 'Library soname: [libpeinit.so.0]'
  fi
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug="$PEKIT_OUT/debug/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug"
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    if grep -aF "$forbidden" "$elf" "$debug" >/dev/null; then
      echo "peinit: build path $forbidden leaked into $elf or its debug file" >&2
      exit 1
    fi
  done
done

test -L "$PEKIT_OUT/usr/bin/reboot"
test "$(readlink "$PEKIT_OUT/usr/bin/reboot")" = svctl
test -s "$PEKIT_OUT/usr/include/peinit.h"
PKG_CONFIG_SYSROOT_DIR="$PEKIT_OUT" \
PKG_CONFIG_PATH="$PEKIT_OUT/$LIBDIR/pkgconfig" \
  pkg-config --exact-version="$PEKIT_VERSION" peinit
./tools/verify-abi.sh
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.bash"             = "*"
"dev.peios.peiosutils"     = ">= 0.8.5"
"org.gnu.diffutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.gawk"             = "*"
"org.gnu.grep"             = "*"
"org.gnu.gzip"             = "*"
"org.gnu.sed"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc"              = "*"
"org.gnu.gcc-c++"          = "*"
"org.llvm.clang"           = ">= 22"
"org.pkgconf.pkgconf"      = "*"
"org.mozilla.cbindgen"     = "0.29.2"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"
"dev.peios.kernel-headers" = ">= 0.20.1-rc13"
"org.iana.tzdata"          = ">= 2026c"

[clean]
command = "cargo clean"
