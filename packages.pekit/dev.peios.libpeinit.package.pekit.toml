# Public C client ABI for programs integrating with peinit. Consumers of this
# library must not acquire or replace PID 1 as a packaging side effect.
[package]
name        = "dev.peios.libpeinit"
description = "Peios service manager client library"
# The peinit2 crate closure the library links; build.main's
# collect-rust-licences --check holds this to what those crates declare.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.libpeinit/LICENSE"
":licenses/**"    = "usr/share/licenses/dev.peios.libpeinit/third-party"
":usr/lib/x86_64-linux-peios/libpeinit.so.0" = "usr/lib/x86_64-linux-peios/libpeinit.so.0"
