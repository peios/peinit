[package]
name = "peinit2"
version = "0.0.12"
description = "Peios PID 1, service control and the public libpeinit client library."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
# Use authd's shared PGSS codec for service-token requests.
auth-core = { git = "https://github.com/peios/authd.git", rev = "41a8bc921bfe9498e37c45ab17e5802534cb863f", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios", "dep:auth-core"]
peios-registry = ["dep:peios"]
