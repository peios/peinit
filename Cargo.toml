[package]
name = "peinit2"
version = "0.0.12"
description = "Peios PID 1, service control and the public libpeinit client library."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
# Use authd's shared PGSS codec for service-token requests.
auth-core = { git = "https://github.com/peios/authd.git", rev = "a014fa4c74f17ce4f67ba964eefce33a1a3dbdfa", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios", "dep:auth-core"]
peios-registry = ["dep:peios"]
