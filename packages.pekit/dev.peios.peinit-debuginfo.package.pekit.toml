# peinit-debuginfo — separated debug symbols for the peinit PID 1 binary,
# svctl, and the libpeinit runtime shared object. build.main splits DWARF into
# /usr/lib/debug/.build-id/ so gdb/perf/debuginfod can find symbols by build-id.

[package]
name        = "dev.peios.peinit-debuginfo"
description = "Peios PID 1 service manager - debugging symbols"
# The peinit2 crate closure; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"



[dependencies]
"dev.peios.peinit"       = "= {{release}}"
"dev.peios.peinit-svctl" = "= {{release}}"
"dev.peios.libpeinit"    = "= {{release}}"

[files]
"@source:LICENSE"      = "usr/share/licenses/dev.peios.peinit-debuginfo/LICENSE"
":licenses/**"         = "usr/share/licenses/dev.peios.peinit-debuginfo/third-party"
":debug/usr/lib/debug/**" = "usr/lib/debug/"
