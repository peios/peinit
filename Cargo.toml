[package]
name = "peinit2"
version = "0.0.12"
description = "Peios PID 1, service control and the public libpeinit client library."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
# Use authd's shared PGSS codec for service-token requests.
auth-core = { git = "https://github.com/peios/authd.git", rev = "b2b4d18ab639dac0e2990f3ccdd8e718d544b353", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3950d35950c46cb3538885b7cf05bde059393def", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios", "dep:auth-core"]
peios-registry = ["dep:peios"]
