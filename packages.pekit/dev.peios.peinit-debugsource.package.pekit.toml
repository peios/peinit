# peinit-debugsource — Rust sources referenced by peinit's debug info, staged
# under /usr/src/debug/peinit. Pairs with peinit-debuginfo.

[package]
name         = "dev.peios.peinit-debugsource"
architecture = "noarch"
description = "Peios PID 1 service manager - debug sources"
# The peinit2 crate closure; checked by build.main.
license      = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"



[dependencies]
"dev.peios.peinit-debuginfo" = "= {{release}}"

[files]
"@source:LICENSE"   = "usr/share/licenses/dev.peios.peinit-debugsource/LICENSE"
":licenses/**"      = "usr/share/licenses/dev.peios.peinit-debugsource/third-party"
":usr/src/debug/**" = "usr/src/debug/"
