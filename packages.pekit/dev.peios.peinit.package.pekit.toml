# peinit — Peios real-root PID 1 service manager.
#
# Shared metadata (format/version/architecture/license) is inherited from the
# base package.pekit.toml. Runtime library dependencies such as libpeios/glibc
# are derived from the binary's DT_NEEDED entries; registryd is explicit because
# peinit's compiled-in Phase 1 service definition requires a registryd provider
# at /usr/sbin/registryd. libpeinit, svctl, headers, and debug material are
# independently installable packages from this same source build.

side_effects = ["man-db"]

[package]
name        = "dev.peios.peinit"
description = "Peios real-root PID 1 service manager"
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[provides]
# `init` is a role rather than the historical package identity.
init = "1"


[claims.provides.init.bin]
target = "/usr/bin/peinit2"
path   = "/init"

[dependencies]
registryd = "*"

[claims.dependencies.registryd.binary]
path = "/usr/sbin/registryd"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.peinit/LICENSE"
":licenses/**"     = "usr/share/licenses/dev.peios.peinit/third-party"
":usr/bin/peinit2" = "usr/bin/peinit2"
":usr/share/man/man8/peinit2.8.gz" = "usr/share/man/man8/peinit2.8.gz"
