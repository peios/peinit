[package]
name = "peinit2"
version = "0.0.1"
description = "Replacement Peios PID 1 service-manager spine."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
peios = { path = "../peios-rs/peios", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios"]
peios-registry = ["dep:peios"]
