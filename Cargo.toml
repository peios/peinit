[package]
name = "peinit2"
version = "0.0.6"
description = "Replacement Peios PID 1 service-manager spine."
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "peinit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
jiff = "0.2.29"
libc = "0.2"
# The PGSS Logon codec, for asking the authority to mint a service token
# (§2.19). A sibling path dep like `peios`, and dependency-free apart from
# libc, so it adds nothing to PID 1's dependency tree.
#
# Speaking the protocol through its own definition rather than hand-rolling the
# message: a second implementation of a security-critical wire format is the
# hazard authd's own service_sid module documents at length, and this is the
# message that mints identity.
libauthd = { git = "https://github.com/peios/authd.git", rev = "3386525989f49f84facc555968d6fc5f5d5e3d53", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f4309f78fbaa878a14429a5e07d778dba9ddfab7", optional = true }
serde_json = "1"
sha1 = "0.10"

[features]
default = []
peios-boundary = ["dep:peios", "dep:libauthd"]
peios-registry = ["dep:peios"]
